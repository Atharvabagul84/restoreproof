name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Local workspace
        - Hosted preview
        - Team workspace (Supabase)
        - Export
        - CI
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser, OS and Node version. Don't paste keys, tokens or confidential briefs.
