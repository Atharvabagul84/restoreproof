worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  map_hash_bucket_size 128;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 512k;
  map $http_apikey $valid_key {
    default 0;
    sb_publishable_restoreproof_local_chisel_v03 1;
  }
  # A publishable key identifies this disposable lab; real user JWTs remain intact.
  map $http_authorization $user_authorization {
    default $http_authorization;
    "Bearer sb_publishable_restoreproof_local_chisel_v03" "";
  }
  server {
    listen 127.0.0.1:8000;
    location = /health { return 200 'ready'; }
    location = /templates/email {
      default_type text/html;
      return 200 '<p>RestoreProof disposable sign-in code: <strong>{{ .Token }}</strong></p>';
    }
    location /auth/v1/ {
      if ($valid_key = 0) { return 401; }
      proxy_set_header Authorization $user_authorization;
      proxy_pass http://127.0.0.1:9999/;
    }
    location /rest/v1/ {
      if ($valid_key = 0) { return 401; }
      proxy_set_header Authorization $user_authorization;
      proxy_pass http://127.0.0.1:3000/;
    }
  }
  server {
    listen 127.0.0.1:3443 ssl;
    ssl_certificate /tmp/tls.crt;
    ssl_certificate_key /tmp/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_set_header Host 127.0.0.1:3443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://127.0.0.1:3100;
    }
  }
}
